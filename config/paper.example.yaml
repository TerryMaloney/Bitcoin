version: 0
mode: paper

clock:
  timezone: UTC
  decision_cadence: 1d
  decision_after_utc_close_minutes: 20

paper_account:
  starting_cash_usd: 10000.0
  allow_short: false
  allow_leverage: false
  min_exposure: 0.0
  max_exposure: 1.0
  allowed_exposures: [0.0, 0.25, 0.5, 0.75, 1.0]

execution:
  signal_bar: daily_close
  execution_bar: next_eligible_bar
  fee_bps: null
  half_spread_bps: null
  adverse_slippage_bps: null
  min_rebalance_change: 0.10
  cooldown_hours: 24

quality:
  fail_closed: true
  max_spot_age_minutes: 90
  max_derivatives_age_minutes: 90
  reject_missing_required_features: true

notifications:
  regime_change: true
  target_exposure_change: true
  paper_order: true
  data_failure: true
  daily_unchanged_state: false

# Execution-friction values intentionally remain null until a documented
# conservative paper-trading profile is chosen. The program must refuse to
# trade when required execution assumptions are unset.
